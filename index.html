<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily WOD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily WOD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c1c1a'/%3E%3Ctext x='50' y='66' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='800' text-anchor='middle' fill='%23ff7a45'%3EDW%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--accent:#d94f1e;--line:#e3e1db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--text:#f1f0ec;--muted:#9a9a93;--accent:#ff7a45;--line:#333330;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--text:#f1f0ec;--muted:#9a9a93;--accent:#ff7a45;--line:#333330;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.date{color:var(--muted);font-size:14px;margin:0}
h1{font-size:28px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.fmt{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:99px}
.title{font-size:22px;font-weight:700;margin:10px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
ul.mv{list-style:none;margin:0;padding:0}
ul.mv li{padding:10px 0;border-top:1px solid var(--line);font-size:18px;display:flex;justify-content:space-between;gap:12px}
a.vid{color:var(--muted);text-decoration:none;font-size:12px;margin-left:6px;opacity:.7}
a.vid:hover{color:var(--accent);opacity:1}
ul.mv li span:last-child{color:var(--muted);font-size:14px;align-self:center;text-align:right}
.time{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 4px}
.cur{text-align:center;color:var(--muted);min-height:22px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 16px;border-radius:10px;cursor:pointer;flex:1;min-width:90px}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
.wt{display:block;width:96px;margin-top:6px;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.log .wrow{border-top:0;padding:0;margin-top:10px;display:flex;gap:8px;justify-content:flex-start}
button.s{padding:8px 12px;font-size:14px;min-width:0;flex:none}
.rnd{display:flex;align-items:center;gap:14px}
.rnd .rl{color:var(--muted);font-size:14px}
.rnd .rn{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:56px}
.rnd .row{flex:1;flex-wrap:nowrap}
.rnd button{padding:16px 12px}
textarea{display:block;width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);resize:vertical}
.log small{white-space:pre-wrap}
h2{font-size:16px;margin:0 0 8px}
.log div{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.log small{color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <p class="date" id="date"></p>
  <h1>Today's WOD</h1>
  <div class="card" id="wod"></div>
  <div class="card">
    <div class="time" id="clock">00:00</div>
    <div class="cur" id="cur"></div>
    <div class="row">
      <button class="p" id="go">Start</button>
      <button id="rst">Reset</button>
    </div>
  </div>
  <div class="card rnd">
    <div><div class="rl">Rounds</div><div class="rn" id="rn">0</div></div>
    <div class="row"><button id="rminus" style="flex:0 0 56px;min-width:0">&minus;</button><button class="p" id="rplus">+ Round</button></div>
  </div>
  <div class="card"><h2>Notes</h2><textarea id="note" rows="3" placeholder="Weights used, substitutions, how it felt..."></textarea></div>
  <div class="row" style="margin-bottom:14px">
    <button id="reroll">Reroll</button>
    <button class="p" id="done">Mark done</button>
  </div>
  <div class="card log"><h2>Log</h2><div id="log"></div><div class="wrow"><button class="s" id="all">Show all</button><button class="s" id="exp">Export CSV</button><button class="s" id="cp">Copy</button></div></div>
</main>
<script>
// Home screen icon (DW)
(function(){try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle="#1c1c1a";x.fillRect(0,0,180,180);x.fillStyle="#ff7a45";x.font="800 84px Arial,Helvetica,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("DW",90,94);var l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}})();

// Movement library: t = type, b = base reps (or cal), u = unit
var LIFT=[
 {n:"Barbell Thruster",b:10},{n:"Barbell Deadlift",b:10},{n:"Barbell Power Clean",b:8},
 {n:"Barbell Front Squat",b:10},{n:"Barbell Push Press",b:10},{n:"Barbell Hang Clean",b:8},
 {n:"DB Thruster",b:10},{n:"DB Snatch (alternating)",b:10},{n:"DB Devil Press",b:6},
 {n:"DB Walking Lunge",b:16},{n:"KB Swing",b:15},{n:"KB Goblet Squat",b:12},
 {n:"KB Clean & Press (each)",b:6},{n:"KB Snatch (each)",b:8}
];
var BODY=[
 {n:"Burpee",b:10},{n:"Air Squat",b:20},{n:"Push-up",b:15},{n:"Sit-up",b:20},
 {n:"V-up",b:12},{n:"Mountain Climber (each leg)",b:15},{n:"Jump Lunge",b:16}
];
var ROW={n:"Row",b:12,u:"cal"};

function seedFrom(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(r,arr,n){var c=arr.slice(),o=[];while(o.length<n&&c.length){o.push(c.splice(Math.floor(r()*c.length),1)[0])}return o}
function r5(x){return Math.max(5,Math.round(x/5)*5)}

function build(seed){
  var r=rng(seed), f=["AMRAP","FOR TIME","EMOM","CHIPPER"][Math.floor(r()*4)], w;
  var L=pick(r,LIFT,2), B=pick(r,BODY,2);
  if(f==="AMRAP"){
    var m=[12,15,18,20][Math.floor(r()*4)];
    w={f:f,cap:m*60,title:m+"-minute AMRAP",sub:"As many rounds as possible. Moderate weight you can move unbroken.",
       mv:[L[0],B[0],ROW].map(function(x){return{n:x.n,w:LIFT.indexOf(x)>-1,q:x.b+(x.u?" cal":"")}})};
  }else if(f==="FOR TIME"){
    var s=[[21,15,9],[15,12,9],[12,9,6]][Math.floor(r()*3)], a=L[0], b=B[0];
    w={f:f,cap:0,title:s.join("-")+" For Time",sub:"Do each movement for the round's reps, then move on. Race the clock.",
       mv:[{n:a.n,w:true,q:s.join(" - ")},{n:b.n,q:s.join(" - ")},{n:"Row",q:s.map(function(x){return Math.round(x*0.8)}).join(" - ")+" cal"}]};
  }else if(f==="EMOM"){
    var m2=[12,16,20][Math.floor(r()*3)], st=[L[0],B[0],ROW,L[1]];
    w={f:f,cap:m2*60,emom:st.map(function(x){return x.n+" x "+x.b+(x.u?" cal":"")}),
       title:m2+"-minute EMOM",sub:"Start a new station every minute, rest what's left. Cycles through "+st.length+" stations.",
       mv:st.map(function(x,i){return{n:"Min "+(i+1)+", "+(i+1+st.length)+", ...",w:LIFT.indexOf(x)>-1,q:x.n+" x "+x.b+(x.u?" cal":"")}})};
  }else{
    var c=[L[0],B[0],ROW,L[1],B[1]];
    w={f:f,cap:0,title:"Chipper",sub:"Work through the list once, top to bottom. Break reps up as needed.",
       mv:c.map(function(x){return{n:x.n,w:LIFT.indexOf(x)>-1,q:(x.u?r5(x.b*2.5):r5(x.b*(LIFT.indexOf(x)>-1?2.5:3)))+(x.u?" cal":"")}})};
  }
  return w;
}

var d=new Date(), key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
var offset=0, W;
try{var o=localStorage.getItem("wod-offset-"+key);if(o)offset=parseInt(o,10)||0}catch(e){}

function vid(name){
  var q=name.replace(/\(.*?\)/g,"").replace(/\bDB\b/g,"dumbbell").replace(/\bKB\b/g,"kettlebell").trim();
  q=(q==="Row"?"rowing machine technique":q+" how to");
  return ' <a class="vid" target="_blank" rel="noopener" title="Watch how" href="https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'">\u25B6</a>';
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function noteKey(){return"wod-note-"+key+"-"+offset}
function loadNote(){var n=document.getElementById("note");try{n.value=localStorage.getItem(noteKey())||""}catch(e){n.value=""}}
function nm(m){return W.f==="EMOM"?m.q.split(" x ")[0]:m.n}
function getW(){try{return JSON.parse(localStorage.getItem("wod-weights")||"{}")}catch(e){return{}}}
function wtIn(m){return m.w?'<input class="wt" type="text" placeholder="weight" data-n="'+esc(nm(m))+'" value="'+esc(getW()[nm(m)]||"")+'">':""}
document.addEventListener("input",function(e){var el=e.target;if(el.classList&&el.classList.contains("wt")){var w=getW();w[el.getAttribute("data-n")]=el.value;try{localStorage.setItem("wod-weights",JSON.stringify(w))}catch(x){}}});
function render(){
  W=build(seedFrom(key+"#"+offset));loadNote();
  document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  document.getElementById("wod").innerHTML='<span class="fmt">'+W.f+'</span><div class="title">'+W.title+'</div><p class="sub">'+W.sub+'</p><ul class="mv">'+
    W.mv.map(function(m){return"<li><span>"+(m.q.indexOf(" x ")>-1&&W.f==="EMOM"?m.q:m.n)+vid(nm(m))+wtIn(m)+"</span><span>"+(W.f==="EMOM"?m.n:m.q)+"</span></li>"}).join("")+"</ul>";
  reset();
}

// Timer
var t=0,iv=null,pre=0,rounds=0;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function show(){
  var shown=W.cap?Math.max(0,W.cap-t):t;
  document.getElementById("clock").textContent=fmt(shown);
  var cur="";if(pre>0){document.getElementById("clock").textContent=pre;document.getElementById("cur").textContent="Get ready\u2026";return}
  if(W.f==="EMOM"&&t<W.cap){cur="Min "+(Math.floor(t/60)+1)+": "+W.emom[Math.floor(t/60)%W.emom.length]}
  if(W.cap&&t>=W.cap){cur="Time!"}
  document.getElementById("cur").textContent=cur;
}
function tick(){if(pre>0){pre--;if(pre>0&&pre<=3)tone(660,120);if(pre===0)beep();show();return}t++;show();if(W.cap&&t>=W.cap){stop();beep()}}
function tone(f,ms){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;window._ac=window._ac||new C();var o=window._ac.createOscillator(),g=window._ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(window._ac.destination);o.start();o.stop(window._ac.currentTime+ms/1000)}catch(e){}}
function beep(){tone(990,500);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function stop(){clearInterval(iv);iv=null;document.getElementById("go").textContent="Start"}
function showR(){document.getElementById("rn").textContent=rounds}
function reset(){stop();t=0;pre=0;rounds=0;showR();show()}
document.getElementById("rplus").onclick=function(){rounds++;showR();try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}};
document.getElementById("rminus").onclick=function(){if(rounds>0)rounds--;showR()};
document.getElementById("go").onclick=function(){
  if(iv){stop();return}
  if(W.cap&&t>=W.cap)t=0;if(t===0&&pre===0)pre=10;
  iv=setInterval(tick,1000);this.textContent="Pause";
};
document.getElementById("rst").onclick=reset;

// Reroll
document.getElementById("reroll").onclick=function(){
  offset++;try{localStorage.setItem("wod-offset-"+key,String(offset))}catch(e){}
  render();
};

// Log
function getLog(){try{return JSON.parse(localStorage.getItem("wod-log")||"[]")}catch(e){return[]}}
var showAll=false;
function drawLog(){
  var l=getLog(),el=document.getElementById("log"),n=showAll?l.length:10;
  el.innerHTML=l.length?l.slice().reverse().slice(0,n).map(function(x){
    var parts=[];if(x.rounds)parts.push(x.rounds+" rd");if(x.wts&&x.wts.length)parts.push(x.wts.join(", "));if(x.note)parts.push(x.note.replace(/\s*\n\s*/g," / "));
    return"<div><span><small>"+esc(x.d)+"</small> "+esc(x.title)+(parts.length?" <small>\u00b7 "+esc(parts.join(" \u00b7 "))+"</small>":"")+"</span><span>"+esc(x.time)+"</span></div>"}).join(""):'<div class="empty">Nothing logged yet.</div>';
  var b=document.getElementById("all");b.style.display=l.length>10?"":"none";b.textContent=showAll?"Show recent":"Show all ("+l.length+")";
}
document.getElementById("all").onclick=function(){showAll=!showAll;drawLog()};
function csv(){var rows=[["Date","Workout","Time","Rounds","Weights","Notes"]];getLog().forEach(function(x){rows.push([x.d,x.title,x.time,x.rounds||"",(x.wts||[]).join("; "),x.note||""])});return rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n")}
function flash(b,txt){var o=b.textContent;b.textContent=txt;setTimeout(function(){b.textContent=o},1500)}
document.getElementById("exp").onclick=function(){
  var b=this,text=csv();
  try{var f=new File([text],"wod-log.csv",{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"WOD log"}).catch(function(){});return}}catch(e){}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download="wod-log.csv";document.body.appendChild(a);a.click();a.remove();flash(b,"Exported \u2713")}catch(e){flash(b,"Try Copy")}
};
document.getElementById("cp").onclick=function(){
  var b=this;try{navigator.clipboard.writeText(csv()).then(function(){flash(b,"Copied \u2713")},function(){flash(b,"Failed")})}catch(e){flash(b,"Failed")}
};
document.getElementById("done").onclick=function(){
  var l=getLog();
  var ws=[];document.querySelectorAll("input.wt").forEach(function(i){if(i.value.trim())ws.push(i.getAttribute("data-n")+": "+i.value.trim())});
  l.push({d:key,title:W.f+": "+W.title,time:t?fmt(t):"done",wts:ws,rounds:rounds,note:document.getElementById("note").value.trim()});
  try{localStorage.setItem("wod-log",JSON.stringify(l))}catch(e){}
  drawLog();this.textContent="Logged \u2713";var b=this;setTimeout(function(){b.textContent="Mark done"},1500);
};

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.getElementById("note").oninput=function(){try{localStorage.setItem(noteKey(),this.value)}catch(e){}};
render();drawLog();
</script>
</body>
</html>
